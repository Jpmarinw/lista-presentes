<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Minha Lista de Presentes</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="header-top">
                    <button
                        id="theme-toggle"
                        class="theme-toggle"
                        aria-label="Alternar tema"
                        type="button"
                    >
                        <svg
                            class="icon-sun"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line
                                x1="4.22"
                                y1="4.22"
                                x2="5.64"
                                y2="5.64"
                            ></line>
                            <line
                                x1="18.36"
                                y1="18.36"
                                x2="19.78"
                                y2="19.78"
                            ></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line
                                x1="4.22"
                                y1="19.78"
                                x2="5.64"
                                y2="18.36"
                            ></line>
                            <line
                                x1="18.36"
                                y1="5.64"
                                x2="19.78"
                                y2="4.22"
                            ></line>
                        </svg>
                        <svg
                            class="icon-moon"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            aria-hidden="true"
                        >
                            <path
                                d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                            ></path>
                        </svg>
                    </button>
                </div>
                <h1 class="header-title">🎁 Minha Lista de Presentes</h1>
                <p class="subtitle">Coisinhas que eu gostaria de ganhar 💝</p>
            </header>

            <main>
                <div id="loading" class="loading">
                    <p>Carregando lista...</p>
                </div>

                <div id="error" class="error hidden">
                    <p>
                        Ops! Não foi possível carregar a lista. Verifique a
                        configuração da planilha.
                    </p>
                </div>

                <div id="tabs-container" class="tabs-container" hidden>
                    <div
                        id="tabs-header"
                        class="tabs-header"
                        role="tablist"
                        aria-label="Listas de presentes"
                    ></div>
                </div>

                <div
                    id="controles-container"
                    class="controles-container"
                    hidden
                >
                    <div class="sort-wrapper">
                        <label for="sort-select" class="sort-label">
                            <svg
                                class="sort-icon"
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="m3 16 4 4 4-4"></path>
                                <path d="M7 20V4"></path>
                                <path d="m21 8-4-4-4 4"></path>
                                <path d="M17 4v16"></path>
                            </svg>
                            <span>Ordenar:</span>
                        </label>
                        <select
                            id="sort-select"
                            class="sort-select"
                            aria-label="Ordenar itens por valor"
                        >
                            <option value="padrao">Padrão da lista</option>
                            <option value="preco-asc">
                                Menor valor (crescente)
                            </option>
                            <option value="preco-desc">
                                Maior valor (decrescente)
                            </option>
                        </select>
                    </div>
                </div>

                <div id="lista-presentes" class="lista"></div>
            </main>

            <footer>
                <p>Feito com 💜 para você</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
